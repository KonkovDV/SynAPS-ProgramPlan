[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "SynAPS-ProgramPlan"
version = "0.1.0"
description = "SynAPS-ProgramPlan: auditable multi-project R&D program planning on SynAPS"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "SynAPS-ProgramPlan contributors" }]
keywords = ["RCPSP", "multi-project", "R&D", "OKR", "scheduling", "constraint-programming"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
# SynAPS is consumed directly (no fork) and pinned by commit, never by branch.
# Keep the SHA in sync with synaps_programplan.versions.SYNAPS_COMMIT (tested).
dependencies = [
  "synaps @ git+https://github.com/KonkovDV/SynAPS.git@786cf1b3bc915941558e7e50b2935de684a32643",
  "pydantic>=2.9",
  "ortools==9.15.6755",
  "defusedxml>=0.7",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-timeout>=2.4",
  "ruff>=0.8",
  "mypy>=1.13",
  "hypothesis>=6.0",
  "types-defusedxml",
  "fastapi>=0.115",
  "httpx>=0.27",
]
api = ["fastapi>=0.115", "httpx>=0.27"]

[project.scripts]
SynAPS-ProgramPlan = "synaps_programplan.cli:main"

[project.urls]
Homepage = "https://github.com/KonkovDV/SynAPS-ProgramPlan"
Upstream = "https://github.com/KonkovDV/SynAPS"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/synaps_programplan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
timeout = 300
markers = ["slow: larger CP-SAT runs"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["synaps_programplan"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["synaps", "synaps.*", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true
