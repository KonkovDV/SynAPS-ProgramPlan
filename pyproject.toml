[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "synaps-okrplan"
version = "0.1.0"
description = "Auditable multi-project R&D (OKR) program planning contour on SynAPS"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "SynAPS OKRPlan contributors" }]
keywords = ["RCPSP", "multi-project", "R&D", "OKR", "scheduling", "constraint-programming"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
# SynAPS is consumed directly (no fork) and pinned by commit, never by branch.
# Keep the SHA in sync with synaps_okrplan.versions.SYNAPS_COMMIT (tested).
dependencies = [
  "synaps @ git+https://github.com/KonkovDV/SynAPS.git@786cf1b3bc915941558e7e50b2935de684a32643",
  "pydantic>=2.9",
  "ortools==9.15.6755",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-timeout>=2.4",
  "ruff>=0.8",
  "mypy>=1.13",
  "hypothesis>=6.0",
  "types-defusedxml",
]

[project.scripts]
okrplan = "synaps_okrplan.cli:main"

[project.urls]
Upstream = "https://github.com/KonkovDV/SynAPS"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/synaps_okrplan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
timeout = 300
markers = ["slow: larger CP-SAT runs"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["synaps_okrplan"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["synaps", "synaps.*"]
ignore_missing_imports = true
