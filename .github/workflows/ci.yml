name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install SynAPS from the pinned commit and SynAPS-ProgramPlan
        run: |
          pip install -e ".[dev]"
      - run: python -m pytest tests -q
      - run: python scripts/lint_claims.py
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy src
